# Tuning for scripts/hooks/ip-hygiene-check.sh — local development only.
#
# The presence of this file in the project root ACTIVATES the hook. That is
# deliberate: the hook is wired from the developer's own ~/.claude/settings.json
# (this repo cannot host project-level Claude settings — see CLAUDE.md), so the
# marker keeps a user-global wiring inert everywhere else.
#
# This file is deliberately NOT scanned by the hook. It has to contain every
# forbidden string in order to match them, so scanning it would guarantee a
# self-inflicted finding.
#
# Sourced as bash by the hook. Keep it declarative — no commands.

# --- Marks that must not appear in PUBLISHED BRANDING METADATA -------------
# Scoped to name/description values only, never prose. Descriptive nominative
# reference in README.md/CLAUDE.md is legitimate; a mark in a published `name`
# or `description` implies endorsement, which the SRD's legal page asks us to
# avoid ("do not include any other attribution to Wizards ... other than that
# provided above").
IP_MARK_PATTERNS=(
  "Dungeons & Dragons"
  "Dungeons and Dragons"
  "D&D"
  "DnD"
  "5.5e"
  "Wizards of the Coast"
  "WotC"
)

# --- Files whose name/description IS published branding --------------------
#
# Leading "*" rather than "*/" on purpose: `*` also matches the empty string, so
# these match both ".claude-plugin/plugin.json" at the root and
# "souroldgeezer-fivee-sim/.claude-plugin/plugin.json" one level down. A "*/" prefix would
# require a leading segment and silently skip the root-level case — and a
# tripwire that silently checks nothing is worse than no tripwire.
IP_METADATA_GLOBS=(
  "*.claude-plugin/marketplace.json"
  "*.claude-plugin/plugin.json"
  "*.codex-plugin/plugin.json"
  "*skills/*/SKILL.md"
  "*agents/*.md"
)

# --- Required attribution --------------------------------------------------
# The string is held here rather than read from NOTICE, because NOTICE is the
# artifact being checked. One line, so it can be matched byte-for-byte.
#
# Every file listed is a shipped artifact and each must carry the statement.
# souroldgeezer-fivee-sim/NOTICE is the copy that actually reaches installs — the plugin
# directory is what gets distributed — so checking only the repo-root copy would
# guard the one that does not ship. Add a path here whenever a new distributable
# surface is created.
IP_ATTRIBUTION_FILES=(
  "NOTICE"
  "souroldgeezer-fivee-sim/NOTICE"
)
IP_ATTRIBUTION_STRING='This work includes material from the System Reference Document 5.2.1 ("SRD 5.2.1") by Wizards of the Coast LLC, available at https://www.dndbeyond.com/srd. The SRD 5.2.1 is licensed under the Creative Commons Attribution 4.0 International License, available at https://creativecommons.org/licenses/by/4.0/legalcode.'
IP_DISCLAIMER_NOTICE_STRING='Section 5 of CC-BY-4.0 includes a Disclaimer of Warranties and Limitation of Liability that limits our liability to you.'

# --- Engine rules data (checked for non-SRD names) -------------------------
IP_DATA_GLOBS=(
  "*engine/src/fivee_sim/data/*"
  "*data/srd/*"
)

# --- Names verified ABSENT from SRD 5.2.1 ----------------------------------
# SRD 5.2.1 covers only part of the 2024 ruleset. Content outside it is not
# licensed to us, so these names must never enter engine data.
#
# HOW THIS LIST WAS DERIVED — follow the same method before adding to it.
# The CC-BY SRD 5.2.1 PDF was converted with `pdftotext`, whitespace-flattened,
# and each candidate counted with a word-boundary grep:
#
#   grep -oiE "(^|[^[:alnum:]])NAME([^[:alnum:]]|$)" srd52.flat.txt | wc -l
#
# Word boundaries matter: a plain substring search reports "Roper" 124 times
# because it matches "properly". Controls were run in both directions — setting
# lore (Drizzt, Waterdeep, Strahd, Vecna) counted 0, and SRD content
# (Tarrasque 23, Grappled 111, Barbarian 39) counted high.
#
# Verified PRESENT and therefore deliberately NOT listed here: Roper, Mimic,
# Cloaker, Bulette, Chuul, Otyugh, Rust Monster, Shambling Mound, Sahuagin,
# Tarrasque, Owlbear, Duergar, and Drow (a 2024 Elf lineage). Do not add them.
#
# Two judgement calls left out on purpose: "Yuan-ti" appears once, in a magic
# item's anatomy example rather than as a creature, and "Xorn" gave conflicting
# counts. Both are omitted so the hook cannot false-positive on licensed text;
# the ip-hygiene skill remains the real gate for cases like these.
IP_NON_SRD_NAMES=(
  # excluded classes / species
  "Artificer"
  "Aasimar"
  # excluded creatures (classic product identity)
  "Beholder"
  "Death Tyrant"
  "Spectator"
  "Mind Flayer"
  "Illithid"
  "Intellect Devourer"
  "Displacer Beast"
  "Umber Hulk"
  "Carrion Crawler"
  "Githyanki"
  "Githzerai"
  "Slaad"
  "Kuo-toa"
  "Modron"
  "Grell"
  "Hook Horror"
  "Flumph"
  "Thri-kreen"
  # setting IP
  "Forgotten Realms"
  "Waterdeep"
  "Menzoberranzan"
  "Drizzt"
  "Elminster"
  "Strahd"
  "Vecna"
)

# --- Optional: path to the audit plugin's objective pre-filter -------------
# Resolution order is $IP_PREFILTER, then this path, then the newest version
# directory in the plugin cache. Missing is fine — the check is skipped.
IP_PREFILTER_REPO_PATH="$HOME/repos/skills/souroldgeezer-audit/skills/ip-hygiene/references/scripts/ip-prefilter.sh"
