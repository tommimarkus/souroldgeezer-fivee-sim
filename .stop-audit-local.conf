# Tuning for scripts/hooks/stop-audit-check.sh — local development only.
#
# The presence of this file in the project root ACTIVATES the hook. That is
# deliberate: the hook is wired from the developer's own ~/.claude/settings.json
# (this repo cannot host project-level Claude settings — see CLAUDE.md), so the
# marker keeps a user-global wiring inert everywhere else. Like the ip-hygiene
# tripwire, the guard is applied twice — once in the settings command and once
# in the script.
#
# Sourced as bash by the hook. Keep it declarative — no commands.

# --- Surfaces whose edits summon the auditors at Stop ----------------------
# Matched with `case` globbing, same semantics as .ip-hygiene-local.conf: `*`
# spans `/`, so "souroldgeezer-fivee-sim/engine/src/*" covers the whole source
# tree, and a leading "*" matches the file at any depth. Paths are
# project-relative; the hook strips one leading ".worktrees/<name>/" segment
# before matching — the same tree checked out one level down — so worktree
# edits match these globs too.
STOP_AUDIT_GLOBS=(
  "souroldgeezer-fivee-sim/engine/src/*"
  "souroldgeezer-fivee-sim/engine/tests/*"
  "scripts/*"
  "*pyproject.toml"
  "*uv.lock"
  "*.claude-plugin/*"
  ".github/workflows/*"
)

# --- Skills the block sends the session to ---------------------------------
# Each is named inline in the block reason, with instructions to scope the
# audit to the touched files the hook lists.
STOP_AUDIT_SKILLS=(
  "souroldgeezer-audit:test-quality-audit"
  "souroldgeezer-audit:devsecops-audit"
)
