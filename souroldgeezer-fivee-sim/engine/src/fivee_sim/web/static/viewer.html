      var mode = declaredMode(payload);
      ["actions", "checkpoints", "attempts"].forEach(function (key) {
        if (!Array.isArray(payload[key])) {
          errors.push(key + " must be an array");
        } else if (key !== "checkpoints") {
          payload[key].forEach(function (record, index) {
            if (!record || typeof record !== "object" || Array.isArray(record)) {
              errors.push(key + "." + index + " must be an object");
            }
          });
        }
      });
      if (payload.initial && typeof payload.initial === "object") {
        validateCombatants(payload.initial.combatants, "initial.combatants", errors);
        validateState(payload.initial.state, "initial.state", errors, mode);
      }
      validateState(payload.latest_state, "latest_state", errors, mode);
      if (!payload.content || typeof payload.content !== "object") {
        errors.push("content must be an object");
      }
      if (!payload.integrity || typeof payload.integrity !== "object") {
        errors.push("integrity must be an object");
      } else if (payload.integrity.algorithm !== "sha256") {
        errors.push("integrity.algorithm must be sha256");
      }
      if (Array.isArray(payload.events)) {
        payload.events.forEach(function (event, index) {
          if (event && typeof event === "object") {
            if (event.seq !== index) { errors.push("events." + index + ".seq must be " + index); }
            if (typeof event.timestamp !== "string" || !event.timestamp.trim()) {
              errors.push("events." + index + ".timestamp must be a non-empty string");
            }
          }
        });
      }
      if (Array.isArray(payload.checkpoints)) {
        /* Graded against the rebuilt chain, so `checkpoints.N.state` means the
           state that checkpoint stands for in every version — carried whole in
           v2 and in v3's keyframe, computed from the one before it after that.
           A chain that breaks is named where it broke and then left alone: the
           checkpoints after it have no baseline, and grading them against a
           baseline that is not theirs would bury the one real finding. */
        var states = checkpointStates(payload);
        payload.checkpoints.forEach(function (checkpoint, index) {
          if (!isRecord(checkpoint)) {
            errors.push("checkpoints." + index + " must be an object");
          } else if (CHAINED_FORMAT_VERSIONS.indexOf(version) !== -1 && index) {
            if (!isRecord(checkpoint.state_delta)) {
              errors.push("checkpoints." + index + ".state_delta must be an object");
            } else if (states[index] === null) {
              errors.push("checkpoints." + index + ".state_delta cannot be applied: "
                + "the checkpoint before it did not reconstruct");
            } else {
              validateState(states[index], "checkpoints." + index + ".state", errors, mode);
            }
          } else {
            validateState(checkpoint.state, "checkpoints." + index + ".state", errors, mode);
          }
        });
      }
      if (!errors.length) { verifyIntegrity(payload, errors); }
    }
    return errors;
  }

  /* Answers whether the bundle was taken, so a caller that is *chaining* loads
     — continuous playback across an adventure's chapters — can stop at a
     chapter that will not load rather than skipping quietly past it. Every
     other caller ignores the answer, and the refusal is still spoken here so
     no caller has to remember to speak it. */
  function loadBundle(payload, sourceName) {
    var diagnostics = validateBundle(payload);
    if (diagnostics.length) {
      window.alert((sourceName || "that") + " is not a valid fivee-sim-replay bundle:\n"
        + diagnostics.join("\n"));
      return false;
    }
    stopPlaying();
    bundle = payload;
    /* Rebuilt here rather than per beat: a scrub drag replays the whole log per
       frame, and a chain rebuilt from the middle is not a chain. */
    checkpointStateList = checkpointStates(payload);
    offset = [0, 0];
    cellFeet = (payload.map && payload.map.grid && payload.map.grid.cell_feet) || 5;
    configureLevels();
    mapDoc = displayDoc(payload.map ? planeDocument(activeLevel) : neutralPlane());
    byId("title").textContent = payload.name || "replay";
    byId("seed").textContent = "seed " + payload.seed;
    byId("empty-note").hidden = true;
    scrub.max = String(payload.events.length);
    var box = canvas.getBoundingClientRect();
    view = R.fitView(mapDoc.grid.width, mapDoc.grid.height, box.width, box.height);
    buildTicker();
    state = null;
    setCursor(0);
    return true;
  }

  byId("btn-open-file").addEventListener("click", function () {
    byId("file-input").click();
  });
  byId("file-input").addEventListener("change", function (event) {
    if (event.target.files.length) { openFileObject(event.target.files[0]); }
    event.target.value = "";
  });
  byId("level-select").addEventListener("change", function () {
    selectLevel(Number(byId("level-select").value));
  });
  byId("follow-level").addEventListener("change", function () {
    followActionLevel();
  });
  byId("sight-cones").addEventListener("change", function () {
    redraw();
  });
  function openFileObject(file) {
    file.text().then(function (text) {
      var payload = null;
      try { payload = JSON.parse(text); } catch (error) {
        window.alert(file.name + " is not JSON: " + error.message);
        return;
      }
      openPayload(payload, file.name);
    });
  }
  document.addEventListener("dragover", function (event) { event.preventDefault(); });
  document.addEventListener("drop", function (event) {
    event.preventDefault();
    if (event.dataTransfer.files.length) {
      openFileObject(event.dataTransfer.files[0]);
    }
  });
  document.addEventListener("keydown", function (event) {
    if (event.target.tagName === "INPUT" || event.target.tagName === "SELECT") { return; }
    if (event.key === "ArrowRight") { stopPlaying(); advancePlayback(); }
    else if (event.key === "ArrowLeft") { stopPlaying(); setCursor(cursor - 1); }
    else if (event.key === " ") { event.preventDefault(); byId("btn-play").click(); }
  });
  window.addEventListener("resize", redraw);

  /* --- an adventure: whole fights, nested as chapters --------------------- */
  /* A run of encounters composes into one file whose chapters are the very
     bundles `encounter.finalize` froze. This half picks between them and does
     nothing else — each chapter is handed to the same loadBundle a lone file
     goes through, so a chapter is graded by the validator above rather than by
     a second one written here. The *envelope* is deliberately not validated:
     its integrity block is the engine's to check, and duplicating that here
     would be a second implementation of a hash contract with nothing holding
     the two together. What this page owes a reader is a refusal that names the
     chapter, not a verdict on the file. */
  var ADVENTURE_FORMAT = "fivee-sim-adventure-replay";
  var chapters = [];
  var chapterIndex = -1;

  function isAdventure(payload) {
    return !!payload && typeof payload === "object"
      && payload.format === ADVENTURE_FORMAT;
  }

  function playChapter(index) {
    var chapter = chapters[index];
    if (!chapter || !chapter.replay || typeof chapter.replay !== "object") {
      window.alert("chapter " + (index + 1) + " carries no replay bundle.");
      return false;
    }
    /* The source name is what a refusal will be spoken as, so it says which
       chapter rather than which file: a reader looking at one bad fight in a
       run of six needs the ordinal, and the file name is the same for all. */
    if (!loadBundle(chapter.replay, "chapter " + (index + 1))) { return false; }
    chapterIndex = index;
    /* The picker follows the chapter rather than deciding it. It is a jump now,
       not the only way to move, so it has to show where playback has got to. */
    byId("chapter-select").value = String(index);
    return true;
  }

  /* Play runs off the end of a chapter and into the next, which is what makes a
     run of walks and fights one timeline instead of six files somebody clicks
     through. Nothing here re-implements loading: the next chapter goes through
     the same playChapter, so the same one validator grades it and the envelope
     stays Python's to grade.

     `loadBundle` stops playback — it has to, since the events under the cursor
     are about to be replaced — so the intent to keep playing is carried across
     by hand rather than by the flag surviving. A chapter that will not load
     ends the run where it stands and leaves the refusal on screen. */
  function advanceChapter() {
    if (chapterIndex < 0 || chapterIndex + 1 >= chapters.length) { return false; }
    if (!playChapter(chapterIndex + 1)) { return false; }
    playing = true;
    byId("btn-play").textContent = "Pause";
    advancePlayback();
    return true;
  }

  function loadAdventure(payload, sourceName) {
    var listed = Array.isArray(payload.chapters) ? payload.chapters : [];
    if (!listed.length) {
      window.alert((sourceName || "that") + " is an adventure with no chapters.");
      return;
    }
    chapters = listed;
    chapterIndex = -1;
    var select = byId("chapter-select");
    select.textContent = "";
    listed.forEach(function (chapter, index) {
      var option = document.createElement("option");
      option.value = String(index);
      var fight = (chapter.replay && chapter.replay.name) || "";
      /* The chapter's own record of which kind it is, when it has one. A jump
         is worth more when it says whether it lands on a fight or a walk, and
         an envelope composed before chapters carried a mode simply has none. */
      var kind = ENCOUNTER_MODES.indexOf(chapter.mode) === -1 ? "" : chapter.mode;
      option.textContent = (index + 1) + ". " + (fight ? fight + " · " : "")
        + (chapter.encounter_id || "") + (kind ? " · " + kind : "");
      select.appendChild(option);
    });
    select.value = "0";
    byId("adventure-chapters").hidden = false;
    playChapter(0);
  }

  /* Every way a document arrives comes through here, so the dispatch on what
     it is happens once. A page that decided per entry point would be a page
     where a dropped adventure worked and an embedded one did not. */
  /* Put the run down. Every path that loads a *lone* replay goes through here
     first, because a leftover chapter list is not merely a stale control since
     playback learned to cross a boundary — it is a viewer that plays a fight
     nobody asked for after the one they opened ends. */
  function forgetAdventure() {
    chapters = [];
    chapterIndex = -1;
    byId("adventure-chapters").hidden = true;
  }

  function openPayload(payload, sourceName) {
    if (isAdventure(payload)) { loadAdventure(payload, sourceName); return; }
    forgetAdventure();
    loadBundle(payload, sourceName);
  }

  byId("chapter-select").addEventListener("change", function () {
    playChapter(Number(byId("chapter-select").value));
  });

  /* --- the served half -------------------------------------------------- */
  /* Everything below runs only when window.__FIVEE_EDITOR__ is present, which
     the server injects and a standalone export does not carry. That is the
     whole offline guarantee: an exported file cannot reach this code, so it
     cannot issue a request, so adding a network path to this page did not
     give the export one. Gate on the config object, never on the protocol. */
  /* Deliberately the same shape as editor.html's `request`: status plus parsed
     body, never a throw on an HTTP error, and a network-level rejection folded
     into status 0 so every caller's chain completes instead of hanging as an
     unhandled rejection. Two pages talking to one server should not disagree
     about what a failed call looks like. */
  function apiGet(path) {
    var config = window.__FIVEE_EDITOR__;
    return window.fetch(config.apiBase + path, {
      headers: { "X-Fivee-Editor-Token": config.token }
    }).then(function (response) {
      return response.text().then(function (text) {
        var parsed = null;
        try { parsed = text ? JSON.parse(text) : null; } catch (e) { parsed = null; }
        return { status: response.status, json: parsed };
      });
    }).catch(function (error) {
      return { status: 0, json: { detail: "replay server unreachable (" + error + ")" } };
    });
  }

  /* The server answers problem+json; its `detail` is the same prose the MCP
     tool would report, so surface that rather than a status number. */
  function refusal(answer, fallback) {
    return (answer.json && answer.json.detail) || (fallback + " (HTTP " + answer.status + ")");
  }

  function playServed(id) {
    if (!id) { return; }
    return apiGet("/replays/" + encodeURIComponent(id)).then(function (answer) {
      if (answer.status !== 200) {
        /* A bundle whose hashes no longer verify is listed but refused, so
           this is the path that names which file is broken. */
        window.alert("cannot play " + id + ": " + refusal(answer, "refused"));
        return;
      }
      forgetAdventure();
      loadBundle(answer.json, id);
    });
  }

  function fillReplayChooser(replays) {
    var select = byId("replay-select");
    select.textContent = "";
    var blank = document.createElement("option");
    blank.value = "";
    blank.textContent = "choose…";
    select.appendChild(blank);
    replays.forEach(function (row) {
      var option = document.createElement("option");
      option.value = row.id;
      option.textContent = row.seed === undefined || row.seed === null
        ? (row.name || row.id)
        : (row.name || row.id) + " · seed " + row.seed;
      select.appendChild(option);
    });
    byId("served-replays").hidden = false;
    /* The empty state has to name the control that just appeared, or the
       chooser is a thing the user has to notice rather than be told about. */
    byId("empty-hint").textContent =
      "Pick a replay above, open a bundle file, or drop one anywhere on this page.";
  }

  function wantedReplay() {
    var search = (window.location && window.location.search) || "";
    var match = /[?&]replay=([^&]*)/.exec(search);
    return match ? decodeURIComponent(match[1]) : null;
  }

  function connectToServer() {
    byId("link-home").hidden = false;
    byId("link-editor").hidden = false;
    byId("replay-select").addEventListener("change", function () {
      playServed(byId("replay-select").value);
    });
    return apiGet("/replays").then(function (answer) {
      /* Deliberately quiet on failure. The chooser is a convenience and the
         file picker is not: a server with no /api/replays must still leave
         this page usable rather than greeting the user with an error. */
      if (answer.status !== 200) { return; }
      var replays = (answer.json && answer.json.replays) || [];
      if (!replays.length) { return; }
      fillReplayChooser(replays);
      var wanted = wantedReplay();
      var known = replays.some(function (row) { return row.id === wanted; });
      if (wanted && known) {
        byId("replay-select").value = wanted;
        return playServed(wanted);
      }
    });
  }

  /* Data sources, in priority order: the embedded slot a standalone export
     fills, then the running server's own replays, then a file opened or
     dropped by hand. */
  var embedded = null;
  try {
    embedded = JSON.parse(document.getElementById("embedded-data").textContent);
  } catch (error) { embedded = null; }
  if (embedded !== null) { openPayload(embedded, "embedded replay"); }
  else if (CONFIG && !CONFIG.token) {
    /* Served, but opened at the bare path: the token is the fragment, so this
       page has nothing to authenticate with. `connectToServer` is deliberately
       quiet on failure, so calling it here would leave no chooser and no
       reason — a page that looks like a server with no replays rather than one
       that cannot ask. Dropping a file still works, and this says so. */
    byId("empty-hint").textContent =
      "Opened without this launch's access token, so the server's replays cannot "
        + "be listed — open the URL printed by `fivee serve`, including the # and "
        + "everything after it. A bundle file dropped here still plays.";
  } else if (CONFIG) { connectToServer(); }
})();
</script>
</body>
</html>
