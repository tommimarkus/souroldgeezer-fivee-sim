<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fivee-sim replay viewer</title>
<script>
/*__EDITOR_CONFIG__*/
</script>
<script type="application/json" id="embedded-data">null</script>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f1ea; --panel: #ebe7de; --edge: #d4cfc2; --text: #2b2925;
  --muted: #6f6a5e; --accent: #7a5c2e; --canvas-bg: #efece3;
  --terrain-floor: #e9e4d8; --terrain-normal: #e9e4d8; --terrain-wall: #4d463c;
  --terrain-difficult: #dcd3bd; --terrain-half-cover: #ddd8c6;
  --terrain-three-quarters-cover: #d3cdb8;
  --terrain-door-open: #e2d3b4; --terrain-door-closed: #8a6f4d;
  --terrain-water: #a9c6ce; --terrain-plain: #d9dfb6; --terrain-forest: #a7c396;
  --terrain-hill: #cfc49c; --terrain-mountain: #b3aa9d;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d1f22; --panel: #24272b; --edge: #34383d; --text: #d9d6cf;
    --muted: #8f8b82; --accent: #c9a86a; --canvas-bg: #191b1e;
    --terrain-floor: #31353b; --terrain-normal: #31353b; --terrain-wall: #14161a;
    --terrain-difficult: #383b34; --terrain-half-cover: #343a3c;
    --terrain-three-quarters-cover: #383f42;
    --terrain-door-open: #403a2c; --terrain-door-closed: #3d3020;
    --terrain-water: #1f3a44; --terrain-plain: #333d2b; --terrain-forest: #25372a;
    --terrain-hill: #3e392a; --terrain-mountain: #48443e;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column;
}
button, select, input { font: inherit; color: inherit; background: var(--panel);
  border: 1px solid var(--edge); border-radius: 4px; padding: 3px 8px; }
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: default; }
header {
  display: flex; align-items: center; gap: 10px; padding: 6px 10px;
  border-bottom: 1px solid var(--edge); background: var(--panel); flex-wrap: wrap;
}
#title { font-weight: 600; }
#seed { color: var(--muted); font-family: ui-monospace, monospace; }
header .spacer { flex: 1; }
#layout { display: flex; flex: 1; min-height: 0; }
#canvas-wrap { flex: 1; position: relative; min-width: 0; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#sidebar {
  width: 340px; border-left: 1px solid var(--edge); background: var(--panel);
  display: flex; flex-direction: column; min-height: 0;
}
#combatant-state {
  padding: 6px; border-bottom: 1px solid var(--edge); max-height: 42%;
  overflow-y: auto;
}
#combatant-state h2 { font-size: 12px; margin: 0 0 4px; color: var(--muted); }
.combatant-card { padding: 4px 6px; margin: 3px 0; border: 1px solid var(--edge);
  border-radius: 4px; }
.combatant-card.current { border-color: var(--accent); }
.combatant-card .muted { color: var(--muted); }
#ticker {
  flex: 1; overflow-y: auto; margin: 0; padding: 4px; list-style: none;
}
#ticker li {
  padding: 2px 6px; border-radius: 4px; cursor: pointer; color: var(--muted);
}
#ticker li.round-row { color: var(--accent); font-weight: 600; margin-top: 4px; }
#ticker li.current { background: var(--bg); color: var(--text); }
#ticker li:hover { background: var(--bg); }
#ticker li.audit-row { border-left: 2px solid var(--accent); padding-left: 8px; }
#ticker li.audit-refused { border-left-color: #b73b35; }
@media (max-width: 40rem) {
  #layout { flex-direction: column; }
  #sidebar {
    inline-size: 100%; block-size: 9rem; flex: 0 0 9rem;
    border-inline-start: 0; border-block-start: 1px solid var(--edge);
  }
  #combatant-state { display: none; }
}
footer {
  border-top: 1px solid var(--edge); background: var(--panel);
  padding: 6px 10px; display: flex; flex-direction: column; gap: 4px;
}
#controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#readout { font-family: ui-monospace, monospace; color: var(--muted); }
#scrub-wrap { position: relative; width: 100%; }
#ticks { display: block; width: 100%; height: 12px; }
#scrub { width: 100%; margin: 0; padding: 0; }
#empty-note {
  position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; color: var(--muted); text-align: center; padding: 2em;
}
#empty-note[hidden] { display: none; }
</style>
</head>
<body>
<header>
  <span id="title">replay viewer</span>
  <span id="seed"></span>
  <label>Storey <select id="level-select" aria-label="visible storey"></select></label>
  <label><input id="follow-level" type="checkbox" checked> Follow action</label>
  <!-- An orientation aid, not a visibility claim: the wedge says which way a
       creature is turned and is deliberately not occluded by walls, because
       only the engine knows what it resolved as seen. Ticked in the markup
       rather than at boot, for the reason the served-only controls below ship
       `hidden` — a standalone export has to be right before any script runs. -->
  <label><input id="sight-cones" type="checkbox" checked> Sight cones</label>
  <!-- Above the spacer, and that placement is the point: unlike the two
       server-only controls below it, this one has to work with no server at
       all. `list_replays` filters on the replay format, so an adventure's
       composed replay is never in the served listing and only ever arrives as
       a file opened, dropped, or embedded. It ships `hidden` for its own
       reason — an ordinary replay has no chapters to offer. -->
  <label id="adventure-chapters" hidden>Chapter
    <select id="chapter-select" aria-label="adventure chapter"></select></label>
  <span class="spacer"></span>
  <!-- Both revealed only when this page is served: a standalone export has no
       server to list replays from and no editor to link back to, and an
       always-visible control that cannot work is worse than an absent one. -->
  <label id="served-replays" hidden>Replay
    <select id="replay-select" aria-label="replay to play"></select></label>
  <a id="link-home" href="/" hidden>Home</a>
  <a id="link-editor" href="/editor" hidden>Map editor</a>
  <button id="btn-open-file">Open replay&#8230;</button>
  <input id="file-input" type="file" accept=".json,application/json" hidden>
</header>
<div id="layout">
  <main id="canvas-wrap">
    <canvas id="stage"></canvas>
    <div id="empty-note">No replay loaded.<br>
      <span id="empty-hint">Open a replay bundle file, or drop one anywhere on
        this page.</span></div>
  </main>
  <aside id="sidebar" aria-label="encounter state and audit timeline">
    <section id="combatant-state" aria-live="polite"></section>
    <ul id="ticker" aria-label="event and audit timeline"></ul>
  </aside>
</div>
<footer>
  <div id="controls">
    <button id="btn-play">Play</button>
    <button id="btn-back">&#8722;1</button>
    <button id="btn-forward">+1</button>
    <select id="speed" aria-label="playback speed">
      <option value="0.5">0.5&#215;</option>
      <option value="1" selected>1&#215;</option>
      <option value="2">2&#215;</option>
      <option value="4">4&#215;</option>
    </select>
    <span id="readout" aria-live="polite">&#8212;</span>
  </div>
  <div id="scrub-wrap">
    <canvas id="ticks"></canvas>
    <input id="scrub" type="range" min="0" max="0" value="0" step="1"
      aria-label="scrub through the fight">
  </div>
</footer>

<script src="/assets/renderer.js"></script>
<script>
/* Served, the absolute path above resolves; opened straight from the static
   directory it cannot, so fall back to the sibling file. A standalone export
   has the renderer inlined instead and skips both. The tag is assembled from
   pieces so the page's script tags stay countable. */
if (typeof FiveeRenderer === "undefined") {
  document.write("<scr" + "ipt src=\"renderer.js\"></scr" + "ipt>");
}
</script>
<script>
"use strict";
(function () {
  var CONFIG = window.__FIVEE_EDITOR__ || null;
  adoptLaunchToken(CONFIG);
  var R = FiveeRenderer;
  var FLASH_KINDS = { attack: 1, opportunity_attack: 1, cast: 1, spell_effect: 1 };

  /* The launch token arrives as this URL's fragment and nowhere else. The
     served body cannot carry it: a page is handed to any client on the port
     without one — being what tells the browser the token is exactly why — so a
     token in the markup is a token every local process can read with a single
     unauthenticated GET, and this token writes files wherever the launching
     user can. A fragment is the one part of a URL a browser never sends, so it
     reaches no request log and no problem+json `instance` either.

     Adopted onto the injected config object itself, under the same `token` key
     `apiGet` already reads off it — this is the same object, so no call site
     changes — and then removed from the address bar, so it is not shoulder-read
     or pasted into a bug report along with `?replay=`. It leaves
     `window.__FIVEE_EDITOR__` present or absent exactly as the server left it,
     which is the whole offline guarantee: a bundle exported to disk carries no
     config, reaches none of the served half, and so issues no request. */
  function adoptLaunchToken(config) {
    if (!config) { return; }
    var raw = ((window.location && window.location.hash) || "").replace(/^#/, "");
    try { config.token = decodeURIComponent(raw); } catch (error) { config.token = raw; }
    if (config.token && window.history && window.history.replaceState) {
      window.history.replaceState(
        null, "", window.location.pathname + (window.location.search || "")
      );
    }
  }

  /* Feature kinds this page draws nothing for. The renderer is shared with
     the editor and draws every feature it is handed, which is right there —
     a spawn hint is the thing you opened the editor to place. Here it is
     stale authoring furniture: it claims no square, no fight ever operates
     it, and by the time a replay plays, the tokens it was placed for are
     already standing on the map. Doors and stairs stay, because those are
     furniture the room really has. The list is a denylist by name so that
     hiding a future kind stays a decision someone writes down. */
  var HIDDEN_FEATURE_KINDS = ["spawn"];

  /* The kinds of chapter a bundle can say it is. A mirror of EncounterMode in
     model/encounter.py, spelled once here and held against that declaration by
     tests/test_web_assets.py — a page that invented a third mode would grade a
     bundle the engine would refuse, and grading is the one thing this page and
     the server have to agree about per chapter. */
  var ENCOUNTER_MODES = ["combat", "exploration"];

  /* Every bundle format_version this page can play, and the same set
     service/replay.py declares as READABLE_FORMAT_VERSIONS. It is spelled here
     because this page grades a dropped file offline, with no engine to ask, and
     no constant crosses the language boundary; tests/test_web_assets.py holds
     the two against each other so the copy cannot lag the original. It was two
     literals in an `if` until that test needed something it could read.

     This is the *readable* set, not the writable one. The engine writes only
     its latest version and keeps reading every version it ever wrote, because a
     bundle already on somebody's disk outlives the writer that made it — which
     is exactly the file this page is usually opened on. */
  var READABLE_FORMAT_VERSIONS = [1, 2, 3];

  /* The readable versions carrying the full encounter envelope, mirroring
     service/replay.py's ENVELOPED_FORMAT_VERSIONS for the same reason the array
     above mirrors READABLE_FORMAT_VERSIONS. Version 1 is the bare shape
     documented in that module and has no encounter, no actions and no
     checkpoints, so everything below the version-agnostic prefix is skipped for
     it — and skipped, deliberately, for a version this page cannot read at all,
     because grading an unknown shape against the newest envelope would bury the
     one diagnostic that matters under twenty that do not.

     It was `version === 2` until version 3 landed, which is exactly the defect
     this spelling exists to stop: the same literal on the Python side quietly
     skipped every envelope check for a v3 bundle. */
  var ENVELOPED_FORMAT_VERSIONS = [2, 3];

  /* The enveloped versions whose checkpoints are a keyframe and a chain of
     deltas rather than a stack of whole states, mirroring service/replay.py's
     CHAINED_FORMAT_VERSIONS. Read by both the grader and the player, so the
     page has one answer to "does this bundle chain?" and Python has the same
     one. A set rather than a floor: "3 and everything after it" is a claim
     about versions nobody has designed. */
  var CHAINED_FORMAT_VERSIONS = [3];

  /* Which keys of a state payload a delta treats as a roster and which as a
     single entry, mirroring model/encounter.py's STATE_ROSTERS and
     STATE_ENTRIES. A whole-fight state has one roster and no single entry; the
     seat-narrowed brief shape a delta can also describe is never a replay
     bundle's, so the empty array is the honest declaration rather than a
     placeholder. */
  var STATE_ROSTERS = ["combatants"];
  var STATE_ENTRIES = [];

  /* Mirrors service/replay.py's `_declared_mode`, fallback included. Null
     covers two different documents and reads them the same deliberate way: a
     bundle frozen before interludes existed carries no mode, and a bundle whose
     mode is not a mode is diagnosed where it stands. Both then fall back to a
     fight's *stricter* reading, so a document that says nothing credible about
     itself is never granted the interlude's relaxation on top of the complaint
     it already earned. */
  function declaredMode(payload) {
    var encounter = payload && payload.encounter;
    if (!encounter || typeof encounter !== "object" || Array.isArray(encounter)) {
      return null;
    }
    return ENCOUNTER_MODES.indexOf(encounter.mode) === -1 ? null : encounter.mode;
  }

  /* Whether the chapter on screen is an interlude — a walk, a conversation, a
     search — rather than a fight. Read off the loaded bundle every time rather
     than cached at load, because it is the bundle that decides and there is
     exactly one of it. */
  function exploring() {
    return bundle !== null && declaredMode(bundle) === "exploration";
  }

  var bundle = null;
  var checkpointStateList = [];  /* the loaded bundle's checkpoint states, in
                                    order, rebuilt once — see checkpointStates */
  var mapDoc = null;      /* what is drawn: the map payload or a synthesized
                             neutral plane, minus the hidden kinds above */
  var offset = [0, 0];    /* cell shift applied on the neutral plane */
  var cellFeet = 5;
  var cursor = 0;         /* how many events are applied: 0..events.length */
  var noteSpeakers = Object.create(null);  /* cursor position -> [speaker, ...] */
  var state = null;
  var view = null;
  var playing = false;
  var playTimer = null;
  var transition = null;
  var transitionFrame = null;
  var activeLevel = 0;
  var motionQuery = window.matchMedia
    ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");
  var scrub = document.getElementById("scrub");
  var ticker = document.getElementById("ticker");

  function byId(id) { return document.getElementById(id); }

  function playbackRate() {
    var rate = Number(byId("speed").value);
    return Number.isFinite(rate) && rate > 0 ? rate : 1;
  }

  function eventDuration() { return 500 / playbackRate(); }

  function reducedMotion() { return motionQuery && motionQuery.matches; }

  function mix(from, to, progress) { return from + (to - from) * progress; }

  function easedProgress() {
    if (!transition) { return 1; }
    var progress = transition.progress;
    return progress * progress * (3 - 2 * progress);
  }

  function feetToCell(point) {
    return [
      Math.floor(point[0] / cellFeet) + offset[0],
      Math.floor(point[1] / cellFeet) + offset[1]
    ];
  }

  function allMapFeatures() {
    if (!bundle || !bundle.map) { return []; }
    var found = (bundle.map.features || []).slice();
    (bundle.map.levels || []).forEach(function (level) {
      (level.features || []).forEach(function (feature) { found.push(feature); });
    });
    return found;
  }

  function planeDocument(level) {
    if (!bundle.map || level === 0) { return displayDoc(bundle.map); }
    var planes = bundle.map.levels || [];
    var plane = null;
    for (var i = 0; i < planes.length; i++) {
      if (Number(planes[i].index) === level) { plane = planes[i]; break; }
    }
    if (!plane) { return displayDoc(bundle.map); }
    var copy = Object.create(null);
    Object.keys(bundle.map).forEach(function (key) { copy[key] = bundle.map[key]; });
    copy.tiles = plane.tiles;
    copy.features = plane.features || [];
    copy.elevation = plane.elevation;
    delete copy.levels;
    return displayDoc(copy);
  }

  function selectLevel(level) {
    activeLevel = Number(level) || 0;
    byId("level-select").value = String(activeLevel);
    if (bundle && bundle.map) { mapDoc = planeDocument(activeLevel); }
    if (state) { state.terrainOverrides = overridesFor(state.featureStates); }
    if (view && mapDoc) {
      var box = canvas.getBoundingClientRect();
      view = R.fitView(mapDoc.grid.width, mapDoc.grid.height, box.width, box.height);
    }
    redraw();
  }

  function configureLevels() {
    var select = byId("level-select");
    select.textContent = "";
    var levels = [{ index: 0, name: "ground" }];
    if (bundle.map) {
      (bundle.map.levels || []).forEach(function (level) {
        levels.push({ index: Number(level.index), name: level.name || ("level " + level.index) });
      });
    }
    levels.sort(function (left, right) { return left.index - right.index; });
    levels.forEach(function (level) {
      var option = document.createElement("option");
      option.value = String(level.index);
      option.textContent = level.name + " (" + level.index + ")";
      select.appendChild(option);
    });
    select.disabled = levels.length === 1;
    activeLevel = levels[0].index;
    select.value = String(activeLevel);
  }

  /* --- folding the event log ------------------------------------------- */

  /* What the fixtures standing open make of the ground, as the renderer's
     generic per-square channel. The derivation is the renderer's, shared with
     the editor and mirroring MapFeatureRecord.claims() server-side — three copies of
     "which squares does this document decide" is how three answers drift.

     Undefined rather than an empty map when nothing is overridden: the
     renderer guards its per-cell lookup on the channel's presence, and most
     replays — every mapless one included — decide no square this way. */
  function overridesFor(states) {
    var overrides = R.terrainOverridesFor(mapDoc, states);
    return Object.keys(overrides).length ? overrides : undefined;
  }

  function initialState() {
    var tokens = Object.create(null);
    var enveloped = ENVELOPED_FORMAT_VERSIONS.indexOf(bundle.format_version) !== -1;
    var authoritative = enveloped && bundle.initial.state
      ? (bundle.initial.state.combatants || []) : (bundle.initial.creatures || []);
    authoritative.forEach(function (creature) {
      tokens[creature.name] = {
        name: creature.name,
        team: creature.team,
        at: feetToCell(creature.position),
        /* Null rather than a default direction: the engine omits the key for a
           creature whose facing nobody is tracking, and inventing north for it
           would draw a chevron the fight never recorded. */
        facing: creature.facing || null,
        hp: creature.hp,
        maxHp: creature.max_hp,
        ac: creature.ac,
        level: Number(creature.level || 0),
        conditions: (creature.conditions || []).slice(),
        concentrating_on: creature.concentrating_on || null,
        dodging: !!creature.dodging,
        disengaged: !!creature.disengaged,
        reaction_available: creature.reaction_available !== false,
        death_saves: creature.death_saves || { successes: 0, failures: 0 },
        spell_slots: creature.spell_slots || {},
        items: creature.items || {},
        down: creature.hp === 0,
        dead: !!creature.dead,
        stable: !!creature.stable
      };
    });
    var featureStates = Object.create(null);
    if (bundle.map) {
      var openList = bundle.initial.map_open_features || [];
      allMapFeatures().forEach(function (feature) {
        /* Carrying a `state` is what makes a feature one the fight owns, not
           being a door: a spawn hint and a drawn stairway have none, a lever
           and a sluice gate do, and the log's interact events name any of
           them. The document picks fixtures by exactly this test. Seeding
           only the doors left every other fixture out of featureStates, so a
           bundle whose live open-list disagreed with the document — the two
           are independent fields, and this page opens any file dropped on
           it — silently replayed the document instead. */
        if (feature.state === undefined || feature.state === null) { return; }
        featureStates[feature.id] = openList.indexOf(feature.id) !== -1
          || (openList.length === 0 && feature.state === "open");
      });
    }
    return {
      tokens: tokens,
      featureStates: featureStates,
      terrainOverrides: overridesFor(featureStates),
      round: bundle.initial.state ? bundle.initial.state.round : 0,
      turn: bundle.initial.state ? bundle.initial.state.turn : "",
      /* Who last did something, which is not the same fact as who holds the
         floor — see fold(). Nobody has yet, so nobody is named. */
      actor: null
    };
  }

  function applyAuthoritative(current, authoritative) {
    if (!authoritative) { return current; }
    current.round = authoritative.round;
    /* `turn` is the engine's to say and this is where it says it — null through
       an interlude, a name through a fight. `actor` is deliberately not reset:
       it is the page's own note of who moved last, and no checkpoint carries
       that, so clearing it here would blank the highlight at every beat. */
    current.turn = authoritative.turn;
    (authoritative.combatants || []).forEach(function (creature) {
      var token = current.tokens[creature.name];
      if (!token) { return; }
      token.at = feetToCell(creature.position);
      /* Read from the authoritative state and nowhere else. A move event
         carries an origin and a destination, so the page could derive the
         turn — but the engine already derived it from the move's final step,
         and a second implementation of that rule here is how the chevron and
         the fight come to disagree. Between checkpoints the facing is the last
         one the state reported, exactly like ac and conditions. */
      token.facing = creature.facing || null;
      token.hp = creature.hp;
      token.maxHp = creature.max_hp;
      token.ac = creature.ac;
      token.level = Number(creature.level || 0);
      token.conditions = (creature.conditions || []).slice();
      token.concentrating_on = creature.concentrating_on || null;
      token.dodging = !!creature.dodging;
      token.disengaged = !!creature.disengaged;
      token.reaction_available = creature.reaction_available !== false;
      token.death_saves = creature.death_saves || { successes: 0, failures: 0 };
      token.spell_slots = creature.spell_slots || {};
      token.items = creature.items || {};
      token.down = !creature.conscious;
      token.dead = !!creature.dead;
      token.stable = !!creature.stable;
    });
    if (authoritative.map && authoritative.map.features) {
      Object.keys(authoritative.map.features).forEach(function (id) {
        current.featureStates[id] = !!authoritative.map.features[id].open;
      });
      current.terrainOverrides = overridesFor(current.featureStates);
    }
    return current;
  }

  function isRecord(value) {
    return !!value && typeof value === "object" && !Array.isArray(value);
  }

  /* model/encounter.py's `state_delta` run backwards: the payload a delta
     describes, laid over the baseline it was computed against.

     Membership is absolute and values are differential. A roster arrives as the
     complete cast in the order it should end up in, each entry thinned to `name`
     plus whatever moved, so a creature that left is gone by being absent and one
     that arrived needs no marker. `dropped` names the paths the baseline had and
     this payload does not — the one thing an overlay cannot say by itself.

     Written from the rule the engine publishes rather than ported from the
     engine's own applier, which is the same choice tests/test_state_views.py
     makes and for the same reason: this page reads bundles it did not write, on
     a machine that may have no engine at all, so agreeing with the *contract* is
     the property worth having. A port would agree with one implementation.

     It shares nothing with either argument. The validator hands it a state it
     has already hashed and graded, and an applier that overlaid into that would
     rewrite the evidence behind an assertion that just passed. */
  function applyStateDelta(baseline, delta, rosters, entries) {
    var result = JSON.parse(JSON.stringify(baseline));
    var dropped = delta.dropped;
    if (Array.isArray(dropped)) {
      dropped.forEach(function (path) { dropPath(result, String(path).split("/")); });
    }
    Object.keys(delta).forEach(function (key) {
      if (key === "dropped") { return; }
      var value = delta[key];
      if (rosters.indexOf(key) !== -1 && Array.isArray(value)) {
        result[key] = overlaidRoster(result[key], value);
      } else if (entries.indexOf(key) !== -1 && isRecord(value)) {
        result[key] = merged(isRecord(result[key]) ? result[key] : {}, value);
      } else {
        result[key] = value;
      }
    });
    return result;
  }

  function merged(held, incoming) {
    var out = {};
    Object.keys(held).forEach(function (key) { out[key] = held[key]; });
    Object.keys(incoming).forEach(function (key) { out[key] = incoming[key]; });
    return out;
  }

  /* The delta's cast, in its order, each entry laid over the one held. Junk is
     carried rather than refused: an entry that is not an object, or one with no
     name, passes through as it arrived, because the caller here is grading an
     untrusted file and has a diagnostic vocabulary for saying so. */
  function overlaidRoster(held, incoming) {
    var previous = Object.create(null);
    (Array.isArray(held) ? held : []).forEach(function (one) {
      if (isRecord(one) && "name" in one) { previous[String(one.name)] = one; }
    });
    return incoming.map(function (entry) {
      if (!isRecord(entry) || !("name" in entry)) { return entry; }
      var was = previous[String(entry.name)];
      return merged(was === undefined ? {} : was, entry);
    });
  }

  /* One path, whose only shapes are `key`, `entry/key` and `roster/name/key`. */
  function dropPath(payload, path) {
    if (path.length === 1) { delete payload[path[0]]; return; }
    var held = payload[path[0]];
    if (path.length === 2) {
      if (isRecord(held)) { delete held[path[1]]; }
      return;
    }
    if (path.length === 3 && Array.isArray(held)) {
      held.forEach(function (entry) {
        if (isRecord(entry) && String(entry.name) === path[1]) { delete entry[path[2]]; }
      });
    }
  }

  /* Every checkpoint's state in order, rebuilt where the bundle stores a delta,
     and null where it could not be — which is a finding for the grader and a
     beat the player leaves to the event fold. Computed once per bundle by both
     of them, because a chain read from the middle is not a chain. */
  function checkpointStates(payload) {
    var chained = CHAINED_FORMAT_VERSIONS.indexOf(payload.format_version) !== -1;
    var states = [];
    (payload.checkpoints || []).forEach(function (checkpoint, index) {
      var record = isRecord(checkpoint) ? checkpoint : {};
      var held = index ? states[index - 1] : null;
      if (!chained || index === 0) {
        states.push(isRecord(record.state) ? record.state : null);
      } else if (held && isRecord(record.state_delta)) {
        states.push(applyStateDelta(held, record.state_delta, STATE_ROSTERS, STATE_ENTRIES));
      } else {
        states.push(null);
      }
    });
    return states;
  }

  /* The authoritative state a beat lands on, or null where none does. It reads
     the rebuilt chain rather than the file, which is the whole of what v3 cost
     this page: `checkpoint.state` used to be the answer and is now only
     sometimes present. */
  function checkpointStateAt(eventCount) {
    var checkpoints = bundle.checkpoints || [];
    for (var i = 0; i < checkpoints.length; i++) {
      if (Number(checkpoints[i].event_count) === eventCount) {
        return checkpointStateList[i] || null;
      }
    }
    return null;
  }

  function fold(current, event, eventCount) {
    current.round = event.round;
    /* Two facts that a fight keeps welded together and an interlude pulls
       apart. `turn` is who holds the floor; `actor` is who just did the thing.
       In a fight they are the same creature, so `turn` keeps driving everything
       it drove before and nothing about a fight changes.

       An interlude has no floor to hold: every state payload the engine froze
       reports `turn` as null, and the checkpoint that lands at this very event
       count would overwrite an invented one a line later anyway — which is why
       taking `turn` from the event here used to produce a highlight that never
       appeared. So an interlude leaves `turn` exactly as the engine wrote it
       and reads the acting token off `actor` instead. The event's own `turn`
       is the better source for it than `actor`: model/encounter.py stamps the
       creature holding the beat, so a reaction resolved inside somebody's turn
       still names whose turn it was. */
    current.actor = event.turn || event.actor || null;
    if (!exploring()) { current.turn = event.turn; }
    var data = event.data || {};
    var token;
    if (event.kind === "move" && data.destination) {
      token = current.tokens[event.actor];
      if (token) {
        token.at = feetToCell(data.destination);
        if (data.to_level !== undefined) { token.level = Number(data.to_level); }
      }
    } else if (event.kind === "damage" || event.kind === "heal") {
      token = current.tokens[event.target];
      if (token && typeof data.hp === "number") {
        token.hp = data.hp;
        if (token.hp > 0) { token.down = false; token.stable = false; }
      }
    } else if (event.kind === "down") {
      token = current.tokens[event.actor];
      if (token) { token.down = true; }
    } else if (event.kind === "death") {
      token = current.tokens[event.actor];
      if (token) { token.dead = true; token.down = true; }
    } else if (event.kind === "stabilised") {
      token = current.tokens[event.actor];
      if (token) { token.stable = true; }
    } else if (event.kind === "death_save") {
      token = current.tokens[event.actor];
      if (token) {
        token.death_saves = {
          successes: Number(data.successes || 0), failures: Number(data.failures || 0)
        };
      }
    } else if (event.kind === "interact" && data.feature !== undefined) {
      var operated = [data.feature];
      if (Array.isArray(data.linked)) { operated = operated.concat(data.linked); }
      operated.forEach(function (featureId) {
        current.featureStates[featureId] = !!data.open;
      });
      /* Re-derived here and in initialState(), which between them are every
         place the open set can move — not in redraw(), which runs on a bare
         resize and once per frame of a scrub drag that is already replaying
         the whole log. */
      current.terrainOverrides = overridesFor(current.featureStates);
    }
    var authoritative = checkpointStateAt(eventCount);
    if (authoritative) { applyAuthoritative(current, authoritative); }
    return current;
  }

  function stateAt(n) {
    var current = initialState();
    for (var i = 0; i < n; i++) { fold(current, bundle.events[i], i + 1); }
    return current;
  }

  function featureById(id) {
    var features = mapDoc.features || [];
    for (var i = 0; i < features.length; i++) {
      if (features[i].id === id) { return features[i]; }
    }
    return null;
  }

  function pulseColor(kind) {
    var dark = R.isDark();
    if (kind === "damage" || kind === "down" || kind === "death") {
      return dark ? "#ef6a63" : "#b73b35";
    }
    if (kind === "heal" || kind === "stabilised") {
      return dark ? "#66c983" : "#2c7a45";
    }
    if (kind === "interact") { return dark ? "#70b7d8" : "#2d7396"; }
    return dark ? "#e8c76a" : "#b98a1e";
  }

  function tokenPoint(name) {
    var token = state.tokens[name];
    if (!token || token.level !== activeLevel) { return null; }
    if (transition && transition.actor === name && transition.fromAt) {
      var progress = easedProgress();
      return [
        mix(transition.fromAt[0], token.at[0], progress),
        mix(transition.fromAt[1], token.at[1], progress)
      ];
    }
    return token.at;
  }

  /* The event's affected cells. While it moves, the cue rises and falls with
     time; a scrubbed-to attack keeps the old static participant highlight. */
  function eventMarks() {
    if (cursor === 0) { return []; }
    var event = transition ? transition.event : bundle.events[cursor - 1];
    if (transition) {
      var alpha = 0.5 * Math.sin(Math.PI * transition.progress);
      var marks = [];
      var seen = Object.create(null);
      var add = function (at) {
        if (!at) { return; }
        var key = at[0] + "," + at[1];
        if (seen[key]) { return; }
        seen[key] = true;
        marks.push({ at: at, color: pulseColor(event.kind), alpha: alpha });
      };
      var data = event.data || {};
      if (event.kind === "move") {
        add(tokenPoint(event.actor));
      } else if (FLASH_KINDS[event.kind]) {
        add(tokenPoint(event.actor));
        add(tokenPoint(event.target));
        var targets = Array.isArray(data.targets) ? data.targets : [];
        targets.forEach(function (name) { add(tokenPoint(name)); });
        if (Array.isArray(data.center) && data.center.length === 2) {
          add(feetToCell(data.center));
        }
      } else if (event.kind === "damage" || event.kind === "heal") {
        add(tokenPoint(event.target));
      } else if (event.kind === "down" || event.kind === "death"
        || event.kind === "stabilised") {
        add(tokenPoint(event.actor));
      } else if (event.kind === "interact") {
        var feature = featureById(data.feature);
        if (feature) { add(feature.at); }
      }
      return marks;
    }
    if (!FLASH_KINDS[event.kind] && event.kind !== "move") { return []; }
    var marks = [];
    [event.actor, event.target].forEach(function (name) {
      var token = state.tokens[name];
      if (token) {
        marks.push({ at: token.at, alpha: FLASH_KINDS[event.kind] ? 0.45 : 0.25 });
      }
    });
    return marks;
  }

  /* A note attributed to somebody is drawn where they stand, which is what
     turns a conversation from text beside the map into something you watch. It
     is static rather than pulsed: a note is not an event, it has no duration,
     and it stays marked for as long as the cursor sits on its moment. A note
     with no speaker marks no square — most notes are the GM's own voice and
     belong to the room rather than to anyone in it. */
  function speakerMarks() {
    var speakers = noteSpeakers[cursor];
    if (!speakers) { return []; }
    var marks = [];
    speakers.forEach(function (name) {
      var at = tokenPoint(name);
      if (at) { marks.push({ at: at, color: pulseColor("note"), alpha: 0.3 }); }
    });
    return marks;
  }

  /* --- rendering -------------------------------------------------------- */
  function renderFrame() {
    var box = R.resizeCanvas(canvas, ctx);
    if (!bundle) { ctx.clearRect(0, 0, box.width, box.height); return; }
    view.width = box.width;
    view.height = box.height;
    var tokens = [];
    Object.keys(state.tokens).forEach(function (name) {
      var token = state.tokens[name];
      if (token.level !== activeLevel) { return; }
      var hp = token.hp;
      if (transition && transition.target === name
        && typeof transition.fromHp === "number") {
        hp = mix(transition.fromHp, token.hp, easedProgress());
      }
      tokens.push({
        at: tokenPoint(name),
        label: name.charAt(0),
        team: token.team,
        hpFraction: token.maxHp > 0 ? hp / token.maxHp : 0,
        down: token.down,
        dead: token.dead,
        stable: token.stable,
        facing: token.facing
      });
    });
    R.render(ctx, mapDoc, view, {
      tokens: tokens,
      featureStates: state.featureStates,
      terrainOverrides: state.terrainOverrides,
      marks: eventMarks().concat(speakerMarks()),
      sightCones: byId("sight-cones").checked
    });
  }

  var framePending = false;
  function redraw() {
    if (framePending) { return; }
    framePending = true;
    window.requestAnimationFrame(function () {
      framePending = false;
      renderFrame();
      drawTicks();
    });
  }

  function drawTicks() {
    var strip = byId("ticks");
    var box = strip.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    strip.width = Math.max(1, Math.round(box.width * dpr));
    strip.height = Math.max(1, Math.round(12 * dpr));
    var tctx = strip.getContext("2d");
    tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    tctx.clearRect(0, 0, box.width, 12);
    if (!bundle || !bundle.events.length) { return; }
    var total = bundle.events.length;
    var dark = R.isDark();
    bundle.events.forEach(function (event, index) {
      var heavy = event.kind === "round";
      if (!heavy && event.kind !== "turn_start") { return; }
      var x = Math.round(((index + 1) / total) * box.width) + 0.5;
      tctx.strokeStyle = heavy
        ? (dark ? "#c9a86a" : "#7a5c2e")
        : (dark ? "rgba(255,255,255,0.25)" : "rgba(0,0,0,0.2)");
      tctx.beginPath();
      tctx.moveTo(x, heavy ? 0 : 5);
      tctx.lineTo(x, 12);
      tctx.stroke();
    });
  }

  function updateReadout() {
    if (!bundle) { byId("readout").textContent = "—"; return; }
    var position = "event " + cursor + "/" + bundle.events.length;
    /* An interlude has no rounds to count — `round` is 1 from its first beat to
       its last, because nothing in it turns one over — so the counter goes on
       the *mode* rather than on the number happening to be 1. A fight with one
       round in it is still a fight and still says so. */
    var text = exploring()
      ? (state.actor ? state.actor + " · " : "") + position
      : "round " + state.round + (state.turn ? " · " + state.turn : "") + " · " + position;
    byId("readout").textContent = text;
  }

  function updateStatePanel() {
    var panel = byId("combatant-state");
    panel.textContent = "";
    var heading = document.createElement("h2");
    heading.textContent = "Combatants";
    panel.appendChild(heading);
    /* Whose card is lit. An interlude rolls no initiative — `order` still lists
       everybody and every combatant's `initiative` is null — so "whose turn"
       has no answer there and the highlight follows whoever last acted
       instead. Conditioned on the mode rather than on `turn` being empty: a
       fight between two rounds legitimately has no current creature, and it
       should not borrow an interlude's reading of that. */
    var acting = exploring() ? state.actor : state.turn;
    Object.keys(state.tokens).forEach(function (name) {
      var token = state.tokens[name];
      var card = document.createElement("div");
      card.className = "combatant-card" + (acting === name ? " current" : "");
      var saves = token.death_saves || { successes: 0, failures: 0 };
      var badges = [];
      if (token.level !== 0) { badges.push("level " + token.level); }
      if (token.conditions.length) { badges.push(token.conditions.join(", ")); }
      if (token.dodging) { badges.push("Dodging"); }
      if (token.disengaged) { badges.push("Disengaged"); }
      if (!token.reaction_available) { badges.push("reaction spent"); }
      if (token.concentrating_on) { badges.push("concentrating: " + token.concentrating_on); }
      if (token.stable) { badges.push("Stable"); }
      if (token.dead) { badges.push("Dead"); }
      var slots = Object.keys(token.spell_slots).map(function (level) {
        return "L" + level + ":" + token.spell_slots[level];
      });
      var items = Object.keys(token.items).map(function (item) {
        return item + ":" + token.items[item];
      });
      card.textContent = name + " · HP " + token.hp + "/" + token.maxHp
        + (token.ac === undefined ? "" : " · AC " + token.ac)
        + " · saves " + saves.successes + "✓/" + saves.failures + "✗"
        + (slots.length ? " · slots " + slots.join(" ") : "")
        + (items.length ? " · items " + items.join(", ") : "")
        + (badges.length ? " · " + badges.join(" · ") : "");
      panel.appendChild(card);
    });
  }

  function updateTicker() {
    var rows = ticker.children;
    var current = null;
    for (var i = 0; i < rows.length; i++) {
      var matches = rows[i].dataset.eventIndex === String(cursor);
      rows[i].classList.toggle("current", matches);
      if (matches) { current = rows[i]; }
    }
    if (current) {
      current.scrollIntoView({ block: "nearest" });
    }
  }

  function followActionLevel() {
    if (!byId("follow-level").checked || cursor === 0) { return; }
    var event = bundle.events[cursor - 1];
    var token = state.tokens[event.actor] || state.tokens[state.turn];
    if (token && token.level !== activeLevel) { selectLevel(token.level); }
  }

  function setCursor(n, incremental) {
    if (!bundle) { return; }
    n = Math.max(0, Math.min(bundle.events.length, n));
    if (incremental && n === cursor + 1) {
      fold(state, bundle.events[cursor]);
    } else if (n !== cursor || state === null) {
      state = stateAt(n);
    }
    cursor = n;
    scrub.value = String(cursor);
    updateReadout();
    updateStatePanel();
    updateTicker();
    followActionLevel();
    redraw();
  }

  /* --- playback --------------------------------------------------------- */
  function cancelTransition() {
    if (transitionFrame !== null) {
      window.cancelAnimationFrame(transitionFrame);
      transitionFrame = null;
    }
    transition = null;
  }

  function stopPlaying() {
    playing = false;
    if (playTimer !== null) { window.clearTimeout(playTimer); playTimer = null; }
    if (transition !== null) {
      cancelTransition();
      redraw();
    }
    byId("btn-play").textContent = "Play";
  }

  function transitionTick(time) {
    if (!transition) { transitionFrame = null; return; }
    if (transition.started === null) { transition.started = time; }
    transition.progress = Math.min(1, (time - transition.started) / transition.duration);
    renderFrame();
    if (transition.progress < 1) {
      transitionFrame = window.requestAnimationFrame(transitionTick);
      return;
    }
    transition = null;
    transitionFrame = null;
    if (playing) { advancePlayback(); }
  }

  function advancePlayback() {
    if (!bundle || cursor >= bundle.events.length) {
      /* The end of a chapter is not the end of the run — see advanceChapter. A
         lone replay has no next chapter and stops here exactly as it did. */
      if (playing && advanceChapter()) { return; }
      if (playing) { stopPlaying(); }
      return;
    }
    var event = bundle.events[cursor];
    var token = state.tokens[event.actor];
    var fromAt = event.kind === "move" && token ? token.at.slice() : null;
    var target = state.tokens[event.target];
    var fromHp = (event.kind === "damage" || event.kind === "heal") && target
      ? target.hp : null;
    fold(state, event, cursor + 1);
    cursor += 1;
    scrub.value = String(cursor);
    updateReadout();
    updateStatePanel();
    updateTicker();
    followActionLevel();

    if (reducedMotion()) {
      redraw();
      if (playing) {
        playTimer = window.setTimeout(advancePlayback, eventDuration());
      }
      return;
    }
    transition = {
      event: event,
      actor: event.actor,
      target: event.target,
      fromAt: fromAt,
      fromHp: fromHp,
      progress: 0,
      started: null,
      duration: eventDuration()
    };
    transitionFrame = window.requestAnimationFrame(transitionTick);
  }

  byId("btn-play").addEventListener("click", function () {
    if (!bundle) { return; }
    if (playing) { stopPlaying(); return; }
    if (cursor >= bundle.events.length) { setCursor(0); }
    playing = true;
    byId("btn-play").textContent = "Pause";
    advancePlayback();
  });
  byId("btn-back").addEventListener("click", function () {
    stopPlaying();
    setCursor(cursor - 1);
  });
  byId("btn-forward").addEventListener("click", function () {
    stopPlaying();
    advancePlayback();
  });
  scrub.addEventListener("input", function () {
    stopPlaying();
    setCursor(Number(scrub.value));
  });

  /* --- loading ---------------------------------------------------------- */
  function describe(event) {
    if (event.detail) { return event.detail; }
    if (event.kind === "turn_start") { return "turn: " + event.actor; }
    if (event.kind === "turn_end") { return "end of " + event.actor + "'s turn"; }
    return event.kind + (event.actor ? " · " + event.actor : "");
  }

  function describeAttempt(attempt) {
    var args = attempt.arguments || {};
    var result = attempt.result || {};
    if (attempt.operation === "encounter_note") {
      /* `speaker` is optional and every note written before it existed has
         none, so its absence reads exactly as it always did rather than as an
         anonymous speaker. Present, it goes in front of the line, because who
         said it is the first thing a reader wants from a conversation. */
      var speaker = noteSpeaker(attempt);
      return (speaker ? speaker + " — " : "")
        + (args.category || "note") + ": " + (args.text || "");
    }
    var label = attempt.operation || "attempt";
    if (attempt.operation === "check") {
      label = args.skill || args.ability || "check";
    }
    if (attempt.status === "refused") { return label + " refused: " + attempt.error; }
    if (result.detail) { return label + ": " + result.detail; }
    return label + " · " + attempt.status;
  }

  /* A note's attributed speaker, or null. Read from the attempt's arguments —
     the one place the journal recorded it — and only for a note, so no other
     audited operation can accidentally start drawing on the map. */
  function noteSpeaker(attempt) {
    if (attempt.operation !== "encounter_note") { return null; }
    var speaker = (attempt.arguments || {}).speaker;
    return typeof speaker === "string" && speaker ? speaker : null;
  }

  function buildTicker() {
    ticker.textContent = "";
    noteSpeakers = Object.create(null);
    var rows = [];
    bundle.events.forEach(function (event, index) {
      rows.push({ timestamp: event.timestamp || "", order: index, event: event, index: index });
    });
    (bundle.attempts || []).forEach(function (attempt, index) {
      rows.push({
        timestamp: attempt.timestamp || attempt.started_at || "",
        order: bundle.events.length + index,
        attempt: attempt
      });
    });
    rows.sort(function (left, right) {
      if (!left.timestamp && !right.timestamp) { return left.order - right.order; }
      if (!left.timestamp) { return -1; }
      if (!right.timestamp) { return 1; }
      return left.timestamp === right.timestamp
        ? left.order - right.order : left.timestamp.localeCompare(right.timestamp);
    });
    /* One timeline, not a log with a side list beside it. Every row — event,
       note, audited check — carries the cursor position it happened at, so
       clicking a line of dialogue scrubs the map to the moment it was spoken
       exactly as clicking an attack does. An attempt sits at however many
       events preceded it in journal order, which is the same position the
       event it belongs to occupies: they are one moment, and both light up. */
    var reached = 0;
    rows.forEach(function (entry) {
      var row = document.createElement("li");
      var at;
      if (entry.event) {
        var event = entry.event;
        if (event.kind === "round") { row.className = "round-row"; }
        row.textContent = describe(event);
        row.title = event.kind + " · round " + event.round
          + (event.timestamp ? " · " + event.timestamp : "");
        at = entry.index + 1;
        if (at > reached) { reached = at; }
      } else {
        var attempt = entry.attempt;
        row.className = "audit-row" + (attempt.status === "refused" ? " audit-refused" : "");
        row.textContent = describeAttempt(attempt);
        row.title = (attempt.operation || "attempt")
          + (entry.timestamp ? " · " + entry.timestamp : "");
        at = reached;
        /* A refused note stays on the timeline — the journal recorded the
           attempt and the audit trail is the point — but it marks no square.
           Nobody said it, so drawing it at the speaker's feet would put a line
           on the map that the engine turned down. */
        var speaker = noteSpeaker(attempt);
        if (speaker && attempt.status !== "refused") {
          (noteSpeakers[at] = noteSpeakers[at] || []).push(speaker);
        }
      }
      row.dataset.eventIndex = String(at);
      row.addEventListener("click", function () {
        stopPlaying();
        setCursor(at);
      });
      ticker.appendChild(row);
    });
  }

  function neutralPlane() {
    /* No map travelled with this fight: size a plain floor to the fight's
       own footprint — every starting position and every move destination —
       with at least a 12x8 stage and a one-cell margin. */
    var squares = [];
    (bundle.initial.creatures || []).forEach(function (creature) {
      squares.push([Math.floor(creature.position[0] / cellFeet),
        Math.floor(creature.position[1] / cellFeet)]);
    });
    bundle.events.forEach(function (event) {
      var data = event.data || {};
      if (event.kind === "move" && data.destination) {
        squares.push([Math.floor(data.destination[0] / cellFeet),
          Math.floor(data.destination[1] / cellFeet)]);
      }
    });
    if (!squares.length) { squares.push([0, 0]); }
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    squares.forEach(function (square) {
      minX = Math.min(minX, square[0]); maxX = Math.max(maxX, square[0]);
      minY = Math.min(minY, square[1]); maxY = Math.max(maxY, square[1]);
    });
    var width = Math.max(12, maxX - minX + 3);
    var height = Math.max(8, maxY - minY + 3);
    offset = [1 - minX, 1 - minY];
    var tiles = [];
    for (var y = 0; y < height; y++) {
      tiles.push(new Array(width + 1).join("."));
    }
    return {
      grid: { width: width, height: height, cell_feet: cellFeet },
      legend: { ".": "floor" },
      tiles: tiles,
      features: []

  }

  /* A shallow copy with the hidden kinds dropped, or the document itself
     when there is nothing to drop — the bundle stays untouched either way,
     because the door timeline reads its own feature list out of it. */
  function displayDoc(doc) {
    var features = doc.features || [];

    for (var i = 0; i < features.length; i++) {
      if (HIDDEN_FEATURE_KINDS.indexOf(features[i].kind) === -1) {
        kept.push(features[i]);
      }
    }
    if (kept.length === features.length) { return doc; }

    Object.keys(doc).forEach(function (key) { copy[key] = doc[key]; });

  function compareCodePoints(left, right) {

    var rightPoints = Array.from(right);
    var length = Math.min(leftPoints.length, rightPoints.length);
    for (var i = 0; i < length; i++) {

    }
    return leftPoints.length - rightPoints.length;

    if (Array.isArray(value)) {

    }
    return "{" + Object.keys(value).sort(compareCodePoints).map(function (key) {
      return JSON.stringify(key) + ":" + canonicalJson(value[key]);

      0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786,
      0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
      0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147,
      0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13,
      0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b,
      0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
      0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a,
      0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208,
      0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2

      0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,

        var big0 = rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22);
        var majority = (a & b) ^ (a & c) ^ (b & c);

      hash[2] = (hash[2] + c) >>> 0; hash[3] = (hash[3] + d) >>> 0;
      hash[4] = (hash[4] + e) >>> 0; hash[5] = (hash[5] + f) >>> 0;

    Object.keys(payload.content).forEach(function (key) {

       than an unhashed field. */
    var states = checkpointStates(payload);
    payload.checkpoints.forEach(function (checkpoint, index) {
      if (checkpoint.state_hash !== sha256Hex(canonicalJson(states[index]))) {

      }

  function isJsonNumber(value) {
    return typeof value === "number" && Number.isFinite(value);
  }

  function validateCombatants(value, path, errors) {
    if (!Array.isArray(value)) { errors.push(path + " must be an array"); return; }
    value.forEach(function (creature, index) {
      var itemPath = path + "." + index;
      if (!creature || typeof creature !== "object" || Array.isArray(creature)) {
        errors.push(itemPath + " must be an object");
        return;
      }
      if (typeof creature.name !== "string" || !creature.name.trim()) {
        errors.push(itemPath + ".name must be a non-empty string");
      }
      if (!Array.isArray(creature.position) || creature.position.length !== 2
        || !creature.position.every(isJsonNumber)) {
        errors.push(itemPath + ".position must be two numeric coordinates");
      }
      ["hp", "max_hp"].forEach(function (key) {
        if (!isJsonNumber(creature[key])) { errors.push(itemPath + "." + key + " must be numeric"); }
      });
    });
  }

  function validateState(value, path, errors, mode) {
    if (!value || typeof value !== "object" || Array.isArray(value)) {
      errors.push(path + " must be an object");
      return;
    }
    if (!Number.isInteger(value.round)) { errors.push(path + ".round must be an integer"); }
    /* Nobody holds the floor between an interlude's beats, so its every state
       payload reports `turn` as null. Conditioned rather than relaxed, exactly
       as service/replay.py's `_validate_state` conditions it: a *fight* with no
       turn is still a broken bundle, and an interlude naming somebody is
       claiming an initiative order that was never rolled. An absent key reads
       as null, because that is what Python's `.get("turn")` makes of it. */
    var turn = value.turn;
    if (mode === "exploration") {
      if (turn !== null && turn !== undefined) {
        errors.push(path + ".turn must be null in an interlude");
      }

      errors.push(path + ".turn must be a string");
    }

  }

  var MAP_FORMAT = "fivee-sim-map";
  var MAP_FEET_PER_SQUARE = 5;

  function validateLegend(value, path, errors) {
    // Structurally bad entries are reported and dropped, exactly as
    // service/replay.py's ``_validate_legend`` treats one: the tile-glyph
    // check below uses whatever parsed, best-effort.
    var legend = {};
    if (!value || typeof value !== "object" || Array.isArray(value)) {
      errors.push(path + " must be an object");
      return legend;
    }
    Object.keys(value).forEach(function (glyph) {
      var kind = value[glyph];
      if (typeof glyph !== "string" || Array.from(glyph).length !== 1) {
        errors.push(path + ": glyph " + JSON.stringify(glyph) + " must be a single character");
        return;
      }
      if (typeof kind !== "string" || !kind.trim()) {
        errors.push(
          path + ": glyph " + JSON.stringify(glyph) + " must name a non-empty terrain kind"
        );
        return;
      }
      legend[glyph] = kind;
    });
    return legend;
  }

  function validateTiles(tiles, path, grid, legend, errors) {
    // ``legend`` is null when the document's own legend was not a usable
    // mapping at all, in which case the glyph check is skipped rather than
    // reporting every character as unknown against a legend nobody wrote.
    if (!Array.isArray(tiles) || !tiles.every(function (row) { return typeof row === "string"; })) {
      errors.push(path + " must be an array of strings");
      return;
    }
    var height = grid && Number.isInteger(grid.height) ? grid.height : null;
    if (height !== null && tiles.length !== height) {
      errors.push(path + " has " + tiles.length + " rows; the grid is " + height + " squares high");
    }
    var width = grid && Number.isInteger(grid.width) ? grid.width : null;
    if (width !== null) {
      tiles.forEach(function (row, y) {
        var length = Array.from(row).length;
        if (length !== width) {

      tiles.forEach(function (row, y) {
        Array.from(row).forEach(function (char, x) {

        });

      Object.keys(unknown).sort().forEach(function (char) {
        var at = unknown[char];
        errors.push(
          path + ": row " + at[1] + " column " + at[0] + " uses " + JSON.stringify(char)

    // Ids are unique across the whole document, not one level's features,
    // which is why ``claimed`` is threaded through every call rather than
    // reset per level.
    if (!Array.isArray(features) || !features.every(function (feature) {
      return feature && typeof feature === "object" && !Array.isArray(feature);
    })) {
      errors.push(path + " must be an array of objects");

    var height = grid && Number.isInteger(grid.height) ? grid.height : null;
    var gridKnown = width !== null && height !== null;
    features.forEach(function (feature, index) {
      var itemPath = path + "." + index;

        errors.push(itemPath + ".id must be a non-empty string");
      } else if (Object.prototype.hasOwnProperty.call(claimed, featureId)) {
        errors.push(itemPath + ".id must be unique across the document");
      } else {
        claimed[featureId] = true;

      var kind = feature.kind;
      if (typeof kind !== "string" || !kind.trim()) {
        errors.push(itemPath + ".kind must be a non-empty string");
      }

      if (!Array.isArray(at) || at.length !== 2 || !at.every(Number.isInteger)) {
        errors.push(itemPath + ".at must be [x, y] square indices");

  function validateMap(value, errors) {

      return;

    if (value.format !== MAP_FORMAT) {
      errors.push("map.format must be " + JSON.stringify(MAP_FORMAT));
    }
    if (!Number.isInteger(value.format_version)) {
      errors.push("map.format_version must be an integer");
    }
    if (typeof value.name !== "string" || !value.name.trim()) {
      errors.push("map.name must be a non-empty string");
    }

    if (!grid || typeof grid !== "object" || Array.isArray(grid)) {
      errors.push("map.grid must be an object");

    } else {
      ["width", "height", "cell_feet"].forEach(function (key) {
        if (!Number.isInteger(grid[key]) || grid[key] <= 0) {
          errors.push("map.grid." + key + " must be a positive integer");
        }
      });

        Number.isInteger(grid.cell_feet) && grid.cell_feet > 0

    var legend = validateLegend(legendRaw, "map.legend", errors);
    var legendForTiles = (legendRaw && typeof legendRaw === "object"

    var claimed = Object.create(null);
    validateTiles(value.tiles, "map.tiles", grid, legendForTiles, errors);
    validateFeatures(
      value.features === undefined ? [] : value.features, "map.features", grid, claimed, errors
    );
    var levels = value.levels === undefined ? [] : value.levels;
    if (!Array.isArray(levels)) {
      errors.push("map.levels must be an array");
      return;
    }
    levels.forEach(function (level, index) {
      var levelPath = "map.levels." + index;
      if (!level || typeof level !== "object" || Array.isArray(level)) {
        errors.push(levelPath + " must be an object");
        return;
      }
      if (!Number.isInteger(level.index)) { errors.push(levelPath + ".index must be an integer"); }
      validateTiles(level.tiles, levelPath + ".tiles", grid, legendForTiles, errors);
      validateFeatures(
        level.features === undefined ? [] : level.features,
        levelPath + ".features", grid, claimed, errors
      );
    });
  }

  function validateBundle(payload) {
    var errors = [];
    if (!payload || typeof payload !== "object" || Array.isArray(payload)) {
      return ["$ must be an object"];
    }
    if (payload.format !== "fivee-sim-replay") {
      errors.push("format must be fivee-sim-replay");
    }
    var version = payload.format_version;
    if (READABLE_FORMAT_VERSIONS.indexOf(version) === -1) {
      errors.push("format_version must be " + READABLE_FORMAT_VERSIONS.join(" or "));
    }
    if (!Number.isInteger(payload.seed)) {
      errors.push("seed must be an integer");
    } else if (!Number.isSafeInteger(payload.seed)) {
      errors.push("seed must be a JavaScript safe integer");
    }
    if (!payload.initial || typeof payload.initial !== "object") {
      errors.push("initial must be an object");
    } else {
      validateCombatants(payload.initial.creatures, "initial.creatures", errors);
      if (!Array.isArray(payload.initial.map_open_features)) {
        errors.push("initial.map_open_features must be an array");

    if (!Array.isArray(payload.events)) {
      errors.push("events must be an array");

          errors.push("events." + index + " must be an object");
        } else if (typeof event.kind !== "string" || !event.kind.trim()) {
          errors.push("events." + index + ".kind must be a non-empty string");
        }

    }
    if (ENVELOPED_FORMAT_VERSIONS.indexOf(version) !== -1) {
      if (!payload.encounter || typeof payload.encounter !== "object") {
        errors.push("encounter must be an object");
      } else {
        if (typeof payload.encounter.id !== "string" || !payload.encounter.id.trim()) {
          errors.push("encounter.id must be a non-empty string");
        }
        if (!Number.isSafeInteger(payload.encounter.seed)) {
          errors.push("encounter.seed must be a JavaScript safe integer");
        } else if (payload.encounter.seed !== payload.seed) {
          errors.push("encounter.seed must equal seed");
        }
        /* Absence is not a finding: a bundle frozen before interludes existed
           carries no mode and every such chapter was a fight. A mode that is
           not one is named here and then read as a fight by declaredMode. */
        if ("mode" in payload.encounter
          && ENCOUNTER_MODES.indexOf(payload.encounter.mode) === -1) {
          errors.push("encounter.mode must be one of: " + ENCOUNTER_MODES.join(", "));
        }
