[project]
name = "fivee-sim"
version = "2026.8.34"
description = "5E-compatible rules kernel and MCP server: seeded, deterministic combat resolution."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2",
]

[project.scripts]
fivee = "fivee_sim.client.cli:main"
fivee-sim-mcp = "fivee_sim.mcp_server.server:main"
fivee-sim-server = "fivee_sim.web.cli:main"
fivee-sim-replay-sample = "fivee_sim.replay_sample:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fivee_sim"]

[dependency-groups]
dev = [
  "pytest>=8",
  "mypy>=1.11",
  "ruff>=0.6",
]

# Keep uv's cache inside the project: the default (~/.cache/uv) is read-only in
# the sandboxed development environment, and at runtime the launcher redirects
# both cache and venv into the active host's durable plugin-data directory so
# nothing is written into the versioned, shared plugin directory.
[tool.uv]
cache-dir = ".cache/uv"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
